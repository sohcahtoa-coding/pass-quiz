<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PASS Challenge: Active Directory Challenge</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #game-container {
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 { color: #58a6ff; font-size: 2.2rem; margin-bottom: 10px; }
        #score-board { font-size: 1.5rem; color: #3fb950; margin-bottom: 20px; font-weight: bold; }
        #question-counter { color: #8b949e; margin-bottom: 20px; }
        
        #scenario { 
            font-size: 1.5rem; 
            margin-bottom: 30px; 
            min-height: 120px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 15px;
        }
        
        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        
        button {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px 25px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            flex: 1 1 40%;
            min-width: 200px;
        }
        button:hover { background-color: #30363d; border-color: #8b949e; }
        button:active { background-color: #282e33; }
        
        .btn-valid { border-left: 4px solid #3fb950; }
        .btn-violation { border-left: 4px solid #f85149; }
        
        #start-btn { background-color: #238636; color: white; border: none; font-size: 1.5rem; padding: 15px 40px; margin-top: 20px;}
        #start-btn:hover { background-color: #2ea043; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Active Directory Challenge</h1>
        <div id="score-board">Score: <span id="score">0</span></div>
        <div id="question-counter" class="hidden">Question <span id="current-q">1</span> of 20</div>
        <div id="scenario">Test your knowledge of Active Directory and Windows Server group scope rules. Take your time, think it through, and see if you can hit the perfect 20,000 score. One wrong move ends the challenge! Just try again...</div>
        
        <div id="options" class="grid-container hidden">
            <!-- Buttons injected by JS -->
        </div>

        <button id="start-btn" onclick="startGame()">Start Challenge</button>
    </div>

    <script>
        const questions = [
            { 
                text: "You need to group together a new intake of helpdesk staff who all reside in the same local domain. You plan to use this group to grant them access to various resources later. What scope is best?", 
                options: ["Global group", "Domain Local group", "Universal group"], 
                answer: "Global group",
                explanation: "Global groups are designed to organise Identities with similar roles from within the same domain before granting them Access to resources."
            },
            { 
                text: "You are setting up permissions for a highly sensitive payroll folder. Which group scope must you apply directly to the folder's Access Control List to manage these permissions securely?", 
                options: ["Global group", "Domain Local group", "Universal group"], 
                answer: "Domain Local group",
                explanation: "Following IGUDLA best practices, Domain Local groups are the only groups that should be applied directly to a resource's Access Control List (ACL) to manage Access."
            },
            { 
                text: "Your company has merged with another business, creating a large multi-domain forest. You need to group together existing departmental groups from three different domains. What scope is required?", 
                options: ["Global group", "Domain Local group", "Universal group"], 
                answer: "Universal group",
                explanation: "Universal groups have a forest-wide scope, making them the only group type capable of consolidating Global groups from multiple different domains."
            },
            { 
                text: "An administrator wants to assign permissions to a shared drive, but they accidentally apply the permissions directly to a group that cannot contain members from other domains. Which group did they use?", 
                options: ["Global group", "Domain Local group", "Universal group"], 
                answer: "Global group",
                explanation: "Global groups are strictly limited to holding members from their own local domain, making them unsuitable for directly managing resource Access in a multi-domain environment."
            },
            { 
                text: "A manager in the Sydney office needs access to a printer located in the Melbourne domain. To grant this access, you should add the manager's Sydney group into which type of group in the Melbourne domain?", 
                options: ["Global group", "Domain Local group", "Universal group"], 
                answer: "Domain Local group",
                explanation: "Because the printer is located in Melbourne, its Access permissions must be managed by a Domain Local group created within that specific Melbourne domain."
            },
            { 
                text: "The IT security team consists of staff spread across five different domains. To follow best practice, you need to consolidate their respective domain groups into a single parent group before adding it to a Domain Local group for resource access. What group scope allows you to consolidate groups from multiple different domains?", 
                options: ["Global group", "Domain Local group", "Universal group"], 
                answer: "Universal group",
                explanation: "Universal groups act as the 'U' in IGUDLA for multi-domain setups, consolidating various Global groups before they are nested into a Domain Local group."
            },
            { 
                text: "You are organising accounts for the Marketing department. All marketing staff work within the same domain. To prepare these accounts to be given access to resources later, you should place them into what type of group?", 
                options: ["Global group", "Domain Local group", "Universal group"], 
                answer: "Global group",
                explanation: "Identities (user accounts) should always be placed into a Global group belonging to their own domain first, representing the 'I' and 'G' in the IGUDLA framework."
            },
            { 
                text: "A junior administrator creates a group in the Perth domain. When they try to add a user from the Brisbane domain to this group, the system blocks it, stating that this specific group type can only contain members from its own local domain. What group scope did they use?", 
                options: ["Global group", "Domain Local group", "Universal group"], 
                answer: "Global group",
                explanation: "The system blocked the action because Global groups cannot accept Identities or groups from outside their own domain."
            },
            { 
                text: "Your network spans multiple countries with limited bandwidth. You need a group to assign local permissions, but want to avoid the active directory replication overhead that comes with forest-wide groups. Which group is best?", 
                options: ["Global group", "Domain Local group", "Universal group"], 
                answer: "Domain Local group",
                explanation: "Unlike Universal groups, changes to Domain Local group membership are not replicated to the Global Catalog across the entire forest, saving bandwidth."
            },
            { 
                text: "A project team consists of engineers from both the Asia and Europe domains. You need to nest their respective domain groups together into a single parent group to manage them easily. Which scope allows membership from multiple domains?", 
                options: ["Global group", "Domain Local group", "Universal group"], 
                answer: "Universal group",
                explanation: "Universal groups can contain Identities and Global groups from any domain in the forest."
            },
            { 
                text: "You are managing access to a high-volume database server. Following Microsoft best practice, which group scope should you apply directly to the server's Access Control List to assign these permissions?", 
                options: ["Global group", "Domain Local group", "Universal group"], 
                answer: "Domain Local group",
                explanation: "IGUDLA best practice states that resource Access should only be assigned directly to Domain Local groups."
            },
            { 
                text: "During a corporate restructure, you successfully add a team group from the HR domain into a resource group in the Finance domain. What must the scope of that receiving Finance group be?", 
                options: ["Global group", "Domain Local group", "Universal group"], 
                answer: "Domain Local group",
                explanation: "To grant cross-domain Access, the receiving group that manages the resource must be a Domain Local group, as Global groups cannot accept outside members."
            },
            { 
                text: "A new branch office has opened. You need to create a group for the branch users, but the group must never be allowed to contain users from outside this specific branch's domain. Which scope enforces this rule?", 
                options: ["Global group", "Domain Local group", "Universal group"], 
                answer: "Global group",
                explanation: "By definition, a Global group restricts its membership to Identities originating from its own domain."
            },
            { 
                text: "You want to grant the 'Global Admins' group from your root domain full control over a shared software deployment folder in a child domain. You place 'Global Admins' into a local group in the child domain. What is the scope of this receiving group?", 
                options: ["Global group", "Domain Local group", "Universal group"], 
                answer: "Domain Local group",
                explanation: "The receiving group in the child domain collects the Global group and assigns it Access to the folder, which is the exact function of a Domain Local group."
            },
            { 
                text: "Company policy states that cross-forest access must be heavily regulated. However, you need a group that can consolidate user groups from any domain within your current forest. What scope provides this exact functionality?", 
                options: ["Global group", "Domain Local group", "Universal group"], 
                answer: "Universal group",
                explanation: "Universal groups allow membership from any domain, making them perfect for forest-wide consolidation without crossing into external forests."
            },
            // AD Terminology & Architecture
            { 
                text: "You are mapping out the logical structure of a new Active Directory environment for a global enterprise. What is the correct hierarchy of AD components, from the largest security boundary down to the smallest management container?", 
                options: ["Forest, Tree, Domain, Organizational Unit", "Domain, Forest, Tree, Organizational Unit", "Forest, Domain, Tree, Organizational Unit"], 
                answer: "Forest, Tree, Domain, Organizational Unit",
                explanation: "The Active Directory logical hierarchy starts with the Forest as the ultimate security boundary. Forests contain Trees, Trees contain Domains, and Domains hold Organizational Units (OUs) to categorise objects."
            },
            { 
                text: "A network administrator needs to apply a specific security policy to only the marketing team's computers. Which Active Directory container is specifically designed to hold these computer objects and have Group Policy Objects (GPOs) linked directly to it?", 
                options: ["Domain", "Organizational Unit", "Site"], 
                answer: "Organizational Unit",
                explanation: "An Organizational Unit (OU) is the smallest administrative container in Active Directory and is the primary target for delegating administration and linking Group Policy Objects."
            },
            { 
                text: "When an employee changes their legal name and gets a new login username, their access to network files remains completely unbroken. What underlying Active Directory component ensures this access remains linked to the user regardless of their display name?", 
                options: ["Security Identifier (SID)", "Access Token", "Distinguished Name (DN)"], 
                answer: "Security Identifier (SID)",
                explanation: "Every object in Active Directory is assigned a unique, immutable Security Identifier (SID) upon creation. Resource permissions are tied directly to this SID, not the easily changeable username."
            },
            { 
                text: "A user successfully authenticates into the domain. When they attempt to open a restricted folder, the file server compares the folder's Access Control List against what temporary digital document generated by the system at logon?", 
                options: ["Access Token", "Security Identifier (SID)", "Kerberos Ticket"], 
                answer: "Access Token",
                explanation: "Upon successful logon, the system generates a temporary Access Token. This token contains the user's personal SID as well as the SIDs of every group they belong to, which is then used to evaluate access rights."
            },
            // Permissions & Access
            { 
                text: "A junior administrator logs directly into a file server console in the server room to retrieve a document. Which type of permissions will the system evaluate to determine their access to the files stored on the local C: drive?", 
                options: ["Share permissions only", "NTFS permissions only", "Both Share and NTFS permissions"], 
                answer: "NTFS permissions only",
                explanation: "Share permissions apply only to network access and do not apply to users who are logged on locally[cite: 1]. NTFS permissions provide granular control and work regardless of whether the access method is local or over the network[cite: 1]."
            }
        ];

        let score = 0;
        let currentQuestionIndex = 0;
        let gameQuestions = [];

        // Shuffle array function
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            score = 0;
            currentQuestionIndex = 0;
            gameQuestions = shuffle([...questions]);
            
            document.getElementById('score').innerText = score;
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('options').classList.remove('hidden');
            document.getElementById('question-counter').classList.remove('hidden');
            
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= gameQuestions.length) {
                let winMsg = `
                    <div style="color: #3fb950; font-size: 2.5rem; font-weight: bold;">Audit Complete!</div>
                    <div style="color: #58a6ff;">Flawless victory. You have mastered IGUDLA!</div>
                `;
                endGame(winMsg);
                return;
            }

            const q = gameQuestions[currentQuestionIndex];
            document.getElementById('scenario').innerHTML = q.text;
            document.getElementById('current-q').innerText = currentQuestionIndex + 1;
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const q = gameQuestions[currentQuestionIndex];
            
            if (selected === q.answer) {
                score += 1000;
                document.getElementById('score').innerText = score;
                currentQuestionIndex++;
                loadQuestion();
            } else {
                let errorMsg = `
                    <div style="color: #f85149; font-size: 2rem; font-weight: bold;">Incorrect!</div>
                    <div>The correct answer was: <span style="color: #58a6ff; font-weight: bold;">${q.answer}</span></div>
                    <div style="background-color: #21262d; border-left: 4px solid #8b949e; padding: 15px; border-radius: 4px; text-align: left; font-size: 1.2rem; color: #c9d1d9; max-width: 90%; margin-top: 10px;">
                        <strong style="color: #8b949e;">Why?</strong> ${q.explanation}
                    </div>
                `;
                endGame(errorMsg);
            }
        }

        function endGame(message) {
            let finalScoreHtml = `<div style="font-size: 1.8rem; color: #3fb950; font-weight: bold; margin-top: 15px;">Final Score: ${score}</div>`;
            
            document.getElementById('scenario').innerHTML = message + finalScoreHtml;
            document.getElementById('options').classList.add('hidden');
            document.getElementById('question-counter').classList.add('hidden');
            document.getElementById('start-btn').innerText = "Try Again";
            document.getElementById('start-btn').classList.remove('hidden');
        }
    </script>
</body>
</html>
